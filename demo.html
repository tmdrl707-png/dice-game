<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>주사위 맞추기 (체험)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" media="print" onload="this.media='all'">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFF6E6; --ink:#1C2142; --muted:#6A6E8C; --card:#fff; --card2:#F6F1E6; --line:rgba(28,33,66,.13);
  --hi:#F4C24D; --hi2:#FFE7A0; --A:#E5484D; --Ad:#B8343A; --B:#2F6FED; --Bd:#2152BC; --C:#12A15A; --Cd:#0C7A43;
  --ok:#17A15A; --no:#D7425E; --felt:#1E7A55; --felt2:#155C40; --coin:#E9A916;
  --fd:'Black Han Sans','Pretendard','Apple SD Gothic Neo',sans-serif;
  --fb:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
body{font-family:var(--fb);color:var(--ink);min-height:100vh;line-height:1.5;word-break:keep-all;-webkit-tap-highlight-color:transparent;
  background:var(--bg) radial-gradient(rgba(28,33,66,.07) 1.2px,transparent 1.3px) 0 0/22px 22px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:disabled{opacity:.4;cursor:default}
input{font:inherit}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
h1,h2,h3{font-weight:800;line-height:1.25}
.muted{color:var(--muted)}
.btn{background:var(--hi);color:var(--ink);font-weight:800;border-radius:16px;padding:13px 18px;font-size:17px;box-shadow:0 3px 0 rgba(28,33,66,.18)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(28,33,66,.18)}
.btn.big{width:100%;padding:17px;font-size:19px}
.btn.ghost{background:var(--card2);box-shadow:none}
.btn.dark{background:var(--ink);color:#fff}
.btn.red{background:var(--A);color:#fff}
#net{position:fixed;top:0;left:0;right:0;z-index:80;background:var(--no);color:#fff;font-weight:800;text-align:center;padding:8px 12px;transform:translateY(-100%);transition:transform .3s}
#net.show{transform:none}

/* 주사위 그림 (작은 SVG) */
.sd{display:inline-block;vertical-align:middle}

/* ========== 입장 화면 ========== */
.E{max-width:440px;margin:0 auto;padding:8vh 20px 40px}
.E-logo{display:flex;gap:10px;margin-bottom:14px}
.E-logo .sd{width:52px;height:52px;filter:drop-shadow(0 4px 0 rgba(28,33,66,.15))}
.E-logo .sd:nth-child(1){transform:rotate(-10deg)}
.E-logo .sd:nth-child(2){transform:rotate(8deg) translateY(6px)}
.E-title{font-family:var(--fd);font-weight:400;font-size:54px;line-height:1;letter-spacing:-.5px}
.E-hero p{margin:12px 0 24px;color:var(--muted);font-size:16px}
.E-card{background:var(--card);border-radius:22px;padding:22px;display:grid;gap:14px;box-shadow:0 6px 24px rgba(28,33,66,.08)}
.E-card label{display:grid;gap:6px;font-weight:700;font-size:14px}
.E-card input{border:2px solid var(--line);background:var(--card2);color:var(--ink);border-radius:14px;padding:14px 16px;font-size:18px;outline:none}
.E-card input:focus{border-color:var(--hi)}
.E details{margin-top:4px}
.E summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}
.E-sub{display:grid;gap:10px;margin-top:8px}
.err{color:var(--no);font-weight:700;min-height:1.2em;font-size:14px}
.E-teacher{margin-top:26px}
.resume{display:block;width:100%;margin-bottom:12px}
.note{margin-top:18px;font-size:13px;color:var(--muted);background:var(--card2);padding:12px 14px;border-radius:12px}
.waitreq{text-align:center}
.waitreq .pi{font-size:46px}

/* ========== 학생 화면 ========== */
.S{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.S-head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:12px 16px;box-shadow:0 4px 16px rgba(28,33,66,.07);margin-bottom:14px}
.S-head .who b{font-size:18px;display:block;line-height:1.2}
.S-head .who small{color:var(--muted);font-size:12px}
.coinbox{display:flex;align-items:center;gap:8px;font-weight:800}
.coinbox b{font-family:var(--fd);font-weight:400;font-size:30px;line-height:1;color:var(--ink)}
.coinbox .rk{background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px;font-size:13px}
.coin-i{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE58A,#E9A916 70%);color:#8A5A00;font-weight:900;font-size:.9em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 4px 16px rgba(28,33,66,.07);margin-bottom:14px}
.S-q{text-align:center}
.S-q .dz{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.S-q .dz .sd{width:40px;height:40px}
.S-q h2{font-family:var(--fd);font-weight:400;font-size:28px;line-height:1.15}
.S .bars{height:150px}
.S-q p{color:var(--muted);font-size:14px;margin-top:6px}
.slots{display:grid;gap:8px;margin:4px 0 14px}
.slots.n1{grid-template-columns:1fr;justify-items:center}
.slots.n3{grid-template-columns:repeat(3,1fr)}
.slots.n5,.slots.n10{grid-template-columns:repeat(5,1fr)}
.slot{border:2.5px dashed var(--line);border-radius:14px;min-height:62px;display:grid;place-items:center;background:var(--card2);position:relative;padding:6px 2px}
.slots.n1 .slot{width:120px;min-height:110px}
.slot i{position:absolute;top:3px;left:7px;font-style:normal;font-size:11px;color:var(--muted);font-weight:700}
.slot b{font-family:var(--fd);font-weight:400;font-size:28px;line-height:1}
.slots.n1 .slot b{font-size:56px}
.slot.fill{border-style:solid;border-color:var(--ink);background:#fff}
.slot.cur{border-color:var(--hi);border-style:solid;box-shadow:0 0 0 4px rgba(244,194,77,.35)}
.slot .res{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-top:3px;text-align:center}
.slot.hit{background:#DDF6E7;border-color:var(--ok);border-style:solid}
.slot.hit .res{color:var(--ok)}
.slot.miss{background:#fff;border-color:#E3D9D9;border-style:solid}
.slot.miss b{color:#9AA0B8}
.slot.wait .res{color:#B5B8CC}
.vals{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
.vals.v6{grid-template-columns:repeat(3,1fr)}
.vals.v12{grid-template-columns:repeat(4,1fr)}
.vals button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 0;font-family:var(--fd);font-size:26px;line-height:1.1;box-shadow:0 3px 0 rgba(28,33,66,.08)}
.vals.v6 button{font-size:34px;padding:16px 0}
.vals.many button{font-size:20px;padding:10px 0}
.vals button.on{background:var(--hi2);border-color:var(--hi)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tools button{background:var(--card2);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px}
.status{text-align:center;font-weight:700;margin-top:10px;font-size:15px}
.status.ok{color:var(--ok)}
.status.warn{color:#B7791F}
.big-msg{text-align:center;padding:28px 18px}
.big-msg .em{font-size:52px;line-height:1.1}
.big-msg h2{font-family:var(--fd);font-weight:400;font-size:30px;margin:10px 0 6px}
.big-msg p{color:var(--muted)}
.gain{font-family:var(--fd);font-size:44px;color:var(--coin);line-height:1.1}
.gain .coin-i{font-size:.6em;vertical-align:.15em}
.hitsum{text-align:center;font-weight:800;font-size:17px;margin-bottom:10px}
.hitsum b{font-family:var(--fd);font-weight:400;font-size:30px;color:var(--ok);margin:0 2px}
.recode{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
.recode b{color:var(--ink);letter-spacing:2px}
.mini-d{display:flex;justify-content:center;gap:2px;margin-top:2px}
.mini-d .sd{width:14px;height:14px}

/* ========== 선생님 화면 ========== */
.T{min-height:100vh;display:grid;grid-template-rows:auto 1fr;gap:1.8vh;padding:2.2vh 2vw;font-size:clamp(14px,min(1.35vw,2.45vh),30px)}
.T-head{display:flex;align-items:center;justify-content:space-between;gap:1.5vw;flex-wrap:wrap}
.T-brand{display:flex;align-items:center;gap:.7em}
.T-brand .sd{width:2.4em;height:2.4em}
.T-title{font-family:var(--fd);font-weight:400;font-size:2.6em;line-height:1}
.T-room{background:var(--ink);color:#fff;border-radius:999px;padding:.25em .9em;font-weight:800;font-size:.95em}
.T-btns{display:flex;gap:.5em;flex-wrap:wrap}
.T-btns button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:.45em .9em;font-weight:800;font-size:.9em}
.T-btns button.warn{border-color:#F3C2CB;color:var(--no)}
.T-main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:1.6vw;min-height:0}
.panel{background:var(--card);border-radius:24px;padding:2.2vh 1.6vw;box-shadow:0 8px 30px rgba(28,33,66,.08);min-width:0;min-height:0;overflow:auto}
.panel h3{font-size:1.05em;color:var(--muted);margin-bottom:.6em}
.q-title{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.q-title .dz{display:flex;gap:.3em}
.q-title .dz .sd{width:2.1em;height:2.1em}
.q-title h2{font-family:var(--fd);font-weight:400;font-size:2.3em;line-height:1.1}
.q-sub{color:var(--muted);font-weight:700;margin:.3em 0 1em}
.q-sub b{color:var(--ink)}
.row{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
.T .btn{font-size:1em;padding:.7em 1.2em;border-radius:14px}
.T .btn.big{font-size:1.2em;padding:.85em 1.4em;width:auto}
.prog{margin:1em 0}
.prog .bar{height:1em;background:var(--card2);border-radius:999px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .4s}
.prog .lbl{display:flex;justify-content:space-between;font-weight:800;margin-bottom:.4em}
.prog .lbl b{font-family:var(--fd);font-weight:400;font-size:1.8em;line-height:1}
.notyet{display:flex;flex-wrap:wrap;gap:.35em;margin-top:.6em}
.notyet span{background:var(--card2);border-radius:999px;padding:.15em .7em;font-size:.85em;color:var(--muted);font-weight:700}
.notyet span.done{background:#DDF6E7;color:var(--ok)}

/* 설정 */
.setup{display:grid;gap:1.1em}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6em}
.presets button{background:var(--card2);border:2.5px solid transparent;border-radius:16px;padding:.7em .9em;text-align:left;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:.5em}
.presets button.on{border-color:var(--hi);background:var(--hi2)}
.presets button small{font-weight:700;color:var(--ok);white-space:nowrap}
.opt{display:grid;grid-template-columns:6.5em 1fr;align-items:center;gap:.6em}
.opt>span{font-weight:800;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:.4em}
.seg button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:.4em .9em;font-weight:800}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.preview{background:var(--card2);border-radius:16px;padding:.8em 1em;display:flex;justify-content:space-between;align-items:center;gap:1em;flex-wrap:wrap}
.preview b{font-family:var(--fd);font-weight:400;font-size:1.5em}
.hist{display:grid;gap:.3em;font-size:.9em}
.hist div{display:flex;gap:.6em;align-items:baseline;border-bottom:1px solid var(--line);padding:.25em 0}
.hist em{font-style:normal;font-weight:800;min-width:2.6em}
.hist span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 주사위 무대 */
.stage-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:1em}
.stage-wrap.man .stage{opacity:.28;filter:grayscale(.6)}
.stage{background:radial-gradient(ellipse at 50% 35%,#2A9468 0%,var(--felt) 55%,var(--felt2) 100%);border-radius:22px;min-height:min(30vh,17vw);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;padding:2.4vh 1vw;box-shadow:inset 0 0 0 6px rgba(0,0,0,.12),inset 0 10px 30px rgba(0,0,0,.25);perspective:900px}
.dice{display:flex;gap:min(5vw,7vh);align-items:center;justify-content:center}
.dcol{display:flex;flex-direction:column;align-items:center;gap:1.2vh}
.dcol span{color:#fff;font-weight:900;font-size:1em;background:rgba(0,0,0,.22);border-radius:999px;padding:.05em .8em}
.die{--s:min(15vh,9.5vw);width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.9,.3,1.15)}
.die.tumbling{transition:transform .14s linear}
.die.settle{transition:transform .4s cubic-bezier(.2,.9,.3,1.15)}
.stage.rolling .dcol{animation:hop .26s ease-in-out infinite alternate}
.stage.rolling .dcol:nth-child(2){animation-delay:.11s}
.stage.rolling .dcol:nth-child(3){animation-delay:.19s}
@keyframes hop{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-24%) rotate(5deg)}}
.pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1em 1.2em;margin-top:.6em}
.pgrid.n1{grid-template-columns:minmax(0,1fr)} .pgrid.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pgrid .bars{height:clamp(100px,13vh,190px);gap:.12em;border-bottom-width:2px}
.pgrid.n1 .bars{height:clamp(140px,22vh,280px);gap:.3em;border-bottom-width:3px}
.pgrid .ch h4{font-size:.78em;margin-bottom:.2em}
.pgrid .ch h4 small b{color:var(--ok);font-size:1.25em}
.pgrid:not(.n1) .bc b{font-size:.55em}
.pgrid:not(.n1) .bw em{font-size:.6em}
.bc.hot b{background:var(--ok);color:#fff;border-radius:5px;padding:0 .2em}
.peek{margin-top:1em}
.rollmsg{text-align:center;font-weight:900;font-size:20px;padding:14px;margin-bottom:12px;background:var(--ink);color:#fff;border-radius:16px}
.rollmsg span{display:inline-block;animation:shake .25s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-14deg) translateY(2px)}to{transform:rotate(14deg) translateY(-3px)}}
.board li[data-a]{cursor:pointer}
.board.big li{font-size:1.25em;padding:.5em .8em}
.pd .nm button{font:inherit;color:inherit}
.srow{border-bottom:1px solid var(--line);padding:.7em 0}
.sh{display:flex;gap:.6em;align-items:baseline;flex-wrap:wrap;margin-bottom:.4em}
.sh .ok{color:var(--ok);font-weight:900}
.scells{display:flex;flex-wrap:wrap;gap:.35em;align-items:center}
.sc{width:3.6em;border-radius:12px;text-align:center;padding:.15em 0 .25em;border:2.5px solid}
.sc b{font-family:var(--fd);font-weight:400;font-size:1.6em;display:block;line-height:1.15}
.sc small{font-size:.72em;font-weight:900;color:var(--muted)}
.sc.hit{background:#DDF6E7;border-color:var(--ok)} .sc.hit small{color:var(--ok)}
.sc.miss{background:#FBF4F4;border-color:#EBD3D3} .sc.miss b{color:#A2667A}
.face{position:absolute;inset:0;border-radius:18%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14%;backface-visibility:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12),inset 0 -6px 12px rgba(0,0,0,.18)}
.face i{display:block;width:72%;height:72%;border-radius:50%;align-self:center;justify-self:center;visibility:hidden;background:#fff;box-shadow:inset 0 2px 2px rgba(0,0,0,.25)}
.face i.p{visibility:visible}
.die.cA .face{background:var(--A)} .die.cB .face{background:var(--B)} .die.cC .face{background:var(--C)}
.f1{transform:translateZ(calc(var(--s)/2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.f2{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.f5{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.readout{color:var(--ink);font-family:var(--fd);font-size:2.4em;line-height:1.1;text-align:center;min-height:1.1em}
.readout small{font-family:var(--fb);font-size:.42em;font-weight:700;color:var(--muted);display:block;margin-top:.2em}
.ctrl{display:grid;gap:.8em}
.tabs{display:inline-flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.tabs button{border-radius:10px;padding:.45em 1em;font-weight:800;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(28,33,66,.12)}
.man{display:flex;flex-wrap:wrap;gap:.4em}
.man button{min-width:2.6em;background:#fff;border:2px solid var(--line);border-radius:12px;padding:.3em .5em;font-family:var(--fd);font-size:1.5em;line-height:1.2;box-shadow:0 3px 0 rgba(28,33,66,.08)}
.man input{width:6em;border:2px solid var(--line);border-radius:12px;padding:.4em .6em;font-size:1.1em}
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.45em}
.strip.n1{grid-template-columns:minmax(0,9em)}
.strip.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.strip.n5{grid-template-columns:repeat(5,minmax(0,1fr))}
.rb{border:2.5px dashed var(--line);border-radius:14px;text-align:center;padding:.35em .2em;position:relative;background:#fff}
.rb i{position:absolute;top:.15em;left:.45em;font-style:normal;font-size:.7em;color:var(--muted);font-weight:800}
.rb b{display:block;font-family:var(--fd);font-weight:400;font-size:2em;line-height:1.15;margin-top:.2em}
.rb .mini-d .sd{width:.95em;height:.95em}
.rb small{display:block;font-size:.72em;font-weight:800;color:var(--ok);margin-top:.15em}
.rb.on{border-style:solid;border-color:var(--ink)}
.rb.next{border-color:var(--hi);border-style:solid;background:var(--hi2)}
.rb.pend b{color:#C9CCDB}
.two-ch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4em;margin-top:1.2em}
.ch h4{font-size:.95em;margin-bottom:.5em;display:flex;justify-content:space-between;gap:.5em}
.ch h4 small{color:var(--muted);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:.3em;height:clamp(120px,20vh,260px);border-bottom:3px solid var(--ink);padding-top:1.4em}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0}
.bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bw i{display:block;width:78%;max-width:3em;min-width:5px;background:#9AA6C9;border-radius:6px 6px 0 0;position:relative;transition:height .5s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.bc.hot .bw i{outline:3px solid var(--ink);outline-offset:1px}
.bc.hot .bw i[style^="height:0%"]{outline:none}
.bw em{position:absolute;top:-1.35em;left:50%;transform:translateX(-50%);font-style:normal;font-weight:900;font-size:.85em}
.bc b{font-weight:900;font-size:.95em;margin-top:.15em}
.bars.many .bc b{font-size:.6em}
.bars.many .bw em{font-size:.6em}
.tops{display:flex;flex-wrap:wrap;gap:.5em;margin-top:.8em}
.tops span{background:#DDF6E7;color:#0E6B3A;border-radius:999px;padding:.2em .8em;font-weight:800}
.big-res{display:flex;align-items:center;gap:1em;margin:1em 0}
.big-res b{font-family:var(--fd);font-weight:400;font-size:4.4em;line-height:1;color:var(--ok)}
.toggle{background:var(--card2);border-radius:10px;padding:.3em .8em;font-weight:800;font-size:.85em}
.toggle.on{background:var(--ink);color:#fff}

/* 순위 */
.board{list-style:none;display:grid;gap:.3em}
.board.two{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:.8em}
.board li{display:grid;grid-template-columns:1.9em minmax(0,1fr) auto auto;align-items:center;gap:.45em;padding:.3em .5em;border-radius:12px;background:var(--card2)}
.board .rk{font-family:var(--fd);text-align:center}
.board .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .cn{font-family:var(--fd);font-size:1.25em;line-height:1}
.board .up{color:var(--ok);font-weight:900;font-size:.8em}
.board li.top1{background:#FFE7A0}
.board li.top2{background:#E8ECF5}
.board li.top3{background:#F7DCC6}
.board.two li{font-size:.92em}

/* 대기실 */
.lobby{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2.4vw;align-items:start}
.join{display:grid;justify-items:center;gap:1.2vh;text-align:center}
.qr{background:#fff;padding:12px;border-radius:16px;line-height:0;min-width:120px;min-height:120px;box-shadow:0 0 0 3px var(--line)}
.qr img,.qr canvas{width:min(30vh,20vw)!important;height:auto!important}
.join-lbl{color:var(--muted);font-weight:800}
.join-code{font-family:var(--fd);font-size:5.5em;line-height:1;letter-spacing:.06em}
.join-url{color:var(--muted);font-size:.8em;word-break:break-all;max-width:22em}
.names{display:flex;flex-wrap:wrap;gap:.5em;align-content:flex-start}
.names button{background:var(--card2);border-radius:12px;padding:.35em .8em;font-weight:800}
.names button i{font-style:normal;color:var(--muted);font-size:.8em;margin-right:.3em}
.names button.bot{opacity:.6}

/* 끝 */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:2vw;margin:2vh 0 3vh}
.pd{display:flex;flex-direction:column;align-items:center;gap:.4em;width:min(22vw,16em)}
.pd .nm{font-family:var(--fd);font-size:2em;line-height:1.1;text-align:center}
.pd .cn{font-weight:900;font-size:1.2em}
.pd .blk{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:center;font-family:var(--fd);font-size:3em;color:#fff}
.pd.p1 .blk{height:22vh;background:linear-gradient(#F7C948,#E9A916)}
.pd.p2 .blk{height:15vh;background:linear-gradient(#B9C2D6,#8E98B0)}
.pd.p3 .blk{height:11vh;background:linear-gradient(#E3A57A,#C47A4B)}

/* 덮개(오버레이) */
.ov{position:fixed;inset:0;z-index:70;background:rgba(20,22,44,.55);display:grid;place-items:center;padding:2vh 2vw;overflow:auto}
.ov-box{background:#fff;border-radius:26px;padding:2.6vh 2vw;max-width:96vw;max-height:96vh;overflow:auto;font-size:clamp(14px,min(1.35vw,2.45vh),30px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.ov-top{display:flex;justify-content:space-between;align-items:center;gap:1em;margin-bottom:1em}
.ov-top h2{font-family:var(--fd);font-weight:400;font-size:2em}
.ov-top button{background:var(--card2);border-radius:12px;padding:.4em 1em;font-weight:800}
.adm{border-collapse:collapse;width:100%}
.adm th,.adm td{border-bottom:1px solid var(--line);padding:.35em .7em;text-align:left}
.adm td button{background:var(--card2);border-radius:8px;padding:.1em .6em;font-weight:800;margin-right:.2em}
.adm td button.x{color:var(--no)}
.reqbar{position:fixed;top:1.4vh;left:50%;transform:translateX(-50%);z-index:75;display:flex;flex-direction:column;gap:8px;max-width:92vw}
.reqbar .rq{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 12px 10px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:min(1.4vw,2.4vh);font-weight:700}
.reqbar button{border-radius:10px;padding:8px 16px;font-weight:800;background:#E6E8F2}
.reqbar button.ok{background:var(--hi)}

/* 36칸 표 */
.tb-wrap{display:grid;grid-template-columns:auto minmax(16em,1fr);gap:2vw;align-items:start}
.tb{border-collapse:separate;border-spacing:.3em}
.tb td,.tb th{width:min(9vh,6vw);height:min(9vh,6vw);text-align:center;border-radius:12px}
.tb th{font-weight:900}
.tb th .sd{width:62%;height:62%}
.tb th.corner{font-size:.9em;line-height:1.15}
.tb th.corner .a{color:var(--A)} .tb th.corner .b{color:var(--B)}
.tb td{background:#F4F5FA;border:2px solid #E3E6F0;transition:opacity .3s,background .3s}
.tb td b{display:block;font-family:var(--fd);font-weight:400;font-size:1.7em;line-height:1}
.tb td small{display:block;font-size:.72em;font-weight:800;color:var(--muted);margin-top:.1em;white-space:nowrap}
.ca{color:var(--A);font-style:normal} .cb{color:var(--B);font-style:normal}
.tb td.dim{opacity:.38}
.tb td.hot{background:#FFE08A;border-color:#F0A81E;opacity:1;animation:pop .45s both;animation-delay:calc(var(--o) * 90ms)}
.tb td.hot b{color:#7A4B00}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.tb-side{display:grid;gap:1em}
.tchips{display:flex;flex-wrap:wrap;gap:.35em}
.tchips button{min-width:2.3em;background:#fff;border:2px solid var(--line);border-radius:10px;padding:.15em .4em;font-family:var(--fd);font-size:1.35em;line-height:1.2}
.tchips button.on{background:#FFE08A;border-color:#F0A81E}
.cnt-big{font-family:var(--fd);font-size:3.6em;line-height:1;color:#C77D00}
.pairs{display:flex;flex-wrap:wrap;gap:.35em}
.pairs span{background:#FFF3CF;border-radius:999px;padding:.1em .7em;font-weight:900}
.axis{display:flex;gap:1em;font-weight:900}
.axis .a{color:var(--A)} .axis .b{color:var(--B)}

@media (max-width:900px){
  .T-main,.lobby,.tb-wrap,.two-ch{grid-template-columns:1fr}
  .pgrid,.pgrid.n3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgrid .ch h4{flex-direction:column;gap:0}
  .T{font-size:15px}
  .strip{grid-template-columns:repeat(5,minmax(0,1fr))}
}

<body>
<div id="net" role="status">⚠️ 연결이 끊겼어요. 다시 연결하는 중…</div>
<div id="app"></div>
<div id="overlay"></div>
<script>
/* =====================================================================
   주사위 맞추기
   - 선생님이 방을 만들고, 학생은 휴대폰으로 QR을 찍어 입장
   - 라운드마다 선생님이 주사위 개수(1~3개)·맞힐 것(눈/합/차/곱/큰 눈)·시도 횟수를 정함
   - 학생은 시도 횟수만큼 숫자를 예상해서 제출, 결과와 같은 칸마다 코인
   - 결과는 컴퓨터로 굴리거나(시뮬레이션) 교실에서 직접 던진 결과를 선생님이 입력
   ===================================================================== */

// ▼▼▼ Firebase 설정값 (math-games 프로젝트, 마피아 마을과 같은 값). null이면 이 브라우저 안에서만 테스트로 동작 ▼▼▼
const FIREBASE_CONFIG = null;   // 체험판: 실제 DB를 쓰지 않고 이 브라우저의 탭끼리만 연결
// ▲▲▲
const TEACHER_PW = '0815';
const ROOT = 'dice';          // 이 게임의 자료는 모두 dice/ 아래에만 저장 (마피아의 mafia/와 분리)
const MAX_PLAYERS = 40;
const PID_KEY = c => 'dice_pid_' + c;
const HOST_KEY = 'dice_host';

/* ---------------- DB (Firebase 또는 로컬 테스트) ---------------- */
const clean = v => (v === undefined ? null : JSON.parse(JSON.stringify(v)));
const DB = (function () {
  if (FIREBASE_CONFIG && window.firebase) {
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    let offset = 0;
    db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
    const R = p => db.ref(ROOT + '/' + p);
    return {
      mode: 'firebase',
      now: () => Date.now() + offset,
      get: p => R(p).once('value').then(s => s.val()),
      set: (p, v) => R(p).set(clean(v)),
      update: (p, o) => R(p).update(clean(o)),
      on: (p, cb) => { const r = R(p); const h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
      remove: p => R(p).remove(),
      onConn: cb => db.ref('.info/connected').on('value', s => cb(!!s.val()))
    };
  }
  // ---- 로컬 테스트용: localStorage 공유 (같은 브라우저의 여러 탭) ----
  const KEY = 'diceLocalDB1';
  const load = () => { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : {}; } catch (e) { return null; } };
  let tree = load() || {};
  const subs = new Set();
  const segs = p => (ROOT + '/' + p).split('/').filter(Boolean);
  const getAt = p => { let n = tree; for (const s of segs(p)) { if (n == null || typeof n !== 'object') return null; n = n[s]; } return n === undefined ? null : n; };
  const prune = v => {
    if (v === null || v === undefined) return null;
    if (Array.isArray(v)) { const a = v.map(prune).filter(x => x !== null); return a.length ? a : null; }
    if (typeof v === 'object') { const o = {}; for (const k in v) { const c = prune(v[k]); if (c !== null) o[k] = c; } return Object.keys(o).length ? o : null; }
    return v;
  };
  const setAt = (p, v) => {
    const ss = segs(p); v = prune(clean(v));
    let n = tree;
    for (let i = 0; i < ss.length - 1; i++) { if (n[ss[i]] == null || typeof n[ss[i]] !== 'object') n[ss[i]] = {}; n = n[ss[i]]; }
    const last = ss[ss.length - 1];
    if (v === null) delete n[last]; else n[last] = v;
  };
  const fire = () => {
    for (const s of subs) {
      const v = getAt(s.p); const j = JSON.stringify(v);
      if (j !== s.last) { s.last = j; s.cb(v == null ? null : JSON.parse(j)); }
    }
  };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tree)); } catch (e) {} fire(); };
  window.addEventListener('storage', e => { if (e.key === KEY) { tree = load() || tree; fire(); } });
  return {
    mode: 'local',
    now: () => Date.now(),
    get: p => Promise.resolve(clean(getAt(p))),
    set: (p, v) => { tree = load() || tree; setAt(p, v); save(); return Promise.resolve(); },
    update: (p, o) => {
      const ks = Object.keys(o);
      for (const a of ks) for (const b of ks) if (a !== b && b.startsWith(a + '/')) throw new Error('경로 충돌: ' + a + ' / ' + b);
      tree = load() || tree; for (const k of ks) setAt(p ? p + '/' + k : k, o[k]); save(); return Promise.resolve();
    },
    remove: p => { tree = load() || tree; setAt(p, null); save(); return Promise.resolve(); },
    onConn: cb => cb(true),
    on: (p, cb) => {
      const s = { p, cb, last: JSON.stringify(getAt(p)) }; subs.add(s);
      setTimeout(() => cb(clean(getAt(p))), 0);
      return () => subs.delete(s);
    }
  };
})();

/* ---------------- 공통 도구 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = n => Array.from({ length: n }, () => 'abcdefghijkmnpqrstuvwxyz23456789'[Math.floor(Math.random() * 32)]).join('');
const arr = x => !x ? [] : Array.isArray(x) ? x.filter(v => v != null) : Object.values(x);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hasB = w => { w = String(w); const c = w.charCodeAt(w.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; };
const josa = (w, noB, withB) => w + (hasB(w) ? withB : noB);
// 숫자 뒤 '로/으로' (끝자리 0·3·6이면 으로: 십·삼·육)
const numRo = v => v + ([0, 3, 6].includes(Math.abs(v) % 10) ? '으로' : '로');
const memStore = (() => { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; })();
const safeStore = get => { try { const s = get(); s.setItem('__t', '1'); s.removeItem('__t'); return s; } catch (e) { return memStore; } };
const store = DB.mode === 'local' ? safeStore(() => sessionStorage) : safeStore(() => localStorage);
const lstore = safeStore(() => localStorage);   // 선생님 설정 기억용

/* ---------------- 주사위 규칙 ---------------- */
const DCOL = ['A', 'B', 'C'];
const KIND_NAME = { face: '눈', sum: '합', diff: '차', prod: '곱', max: '큰 눈' };
function kindLabel(d, k) {
  if (k === 'face') return '나온 눈';
  const w = d === 2 ? '두' : '세';
  if (k === 'sum') return `${w} 눈의 합`;
  if (k === 'prod') return `${w} 눈의 곱`;
  if (k === 'diff') return d === 2 ? '두 눈의 차' : '가장 큰 눈 − 가장 작은 눈';
  if (k === 'max') return `${w} 눈 중 가장 큰 눈`;
  return '';
}
function kindHint(d, k) {
  if (k === 'diff' && d === 2) return '큰 눈에서 작은 눈을 빼요';
  return '';
}
const calc = (k, f) => k === 'face' ? f[0] : k === 'sum' ? f.reduce((a, b) => a + b, 0) : k === 'prod' ? f.reduce((a, b) => a * b, 1)
  : k === 'diff' ? Math.max(...f) - Math.min(...f) : k === 'max' ? Math.max(...f) : null;
function outcomes(d) { let r = [[]]; for (let i = 0; i < d; i++) { const nx = []; for (const x of r) for (let v = 1; v <= 6; v++) nx.push([...x, v]); r = nx; } return r; }
const VCACHE = {};
const possible = (d, k) => VCACHE[d + k] || (VCACHE[d + k] = [...new Set(outcomes(d).map(f => calc(k, f)))].sort((a, b) => a - b));
const choices = (d, k) => possible(d, k);   // 학생은 나올 수 있는 값만 고름 (합이면 2~12)
// 100번·1000번: 학생은 '가장 많이 나올 숫자' 하나만 예상 (최빈값을 맞히면 코인)
const isBig = r => r && r.n >= 100;
const slotsN = r => (isBig(r) ? 1 : r.n);
const modesOf = res => { const c = {}; res.forEach(v => (c[v] = (c[v] || 0) + 1)); const mx = Math.max(0, ...Object.values(c)); return mx ? Object.keys(c).filter(v => c[v] === mx).map(Number) : []; };
const countOf = res => { const c = {}; res.forEach(v => (c[v] = (c[v] || 0) + 1)); return c; };
const rollFaces = d => Array.from({ length: d }, () => 1 + Math.floor(Math.random() * 6));
const cfgTitle = r => `주사위 ${r.d}개 · ${KIND_NAME[r.kind]} · ${r.n}번`;
const sameCfg = (a, b) => a.d === b.d && a.kind === b.kind;

// 작은 주사위 그림 (SVG)
const PIP_XY = { tl: [27, 27], tr: [73, 27], ml: [27, 50], c: [50, 50], mr: [73, 50], bl: [27, 73], br: [73, 73] };
const PIP_OF = { 1: ['c'], 2: ['tl', 'br'], 3: ['tl', 'c', 'br'], 4: ['tl', 'tr', 'bl', 'br'], 5: ['tl', 'tr', 'c', 'bl', 'br'], 6: ['tl', 'tr', 'ml', 'mr', 'bl', 'br'] };
const DFILL = { A: '#E5484D', B: '#2F6FED', C: '#12A15A', W: '#ffffff' };
function dieSVG(v, c = 'A') {
  const fill = DFILL[c], pip = c === 'W' ? '#1C2142' : '#fff';
  return `<svg class="sd" viewBox="0 0 100 100" aria-label="${v}"><rect x="4" y="4" width="92" height="92" rx="20" fill="${fill}" stroke="rgba(0,0,0,.18)" stroke-width="4"/>${(PIP_OF[v] || []).map(p => `<circle cx="${PIP_XY[p][0]}" cy="${PIP_XY[p][1]}" r="9.5" fill="${pip}"/>`).join('')}</svg>`;
}
const diceIcons = (d, vals) => Array.from({ length: d }, (_, i) => dieSVG(vals ? vals[i] : [5, 3, 6][i], DCOL[i])).join('');

/* ---------------- 상태 ---------------- */
let S = {};
const App = { mode: null, code: null, pid: null, hostId: null, unsub: [], timers: [], active: false, ov: null, ovShown: null,
  draft: null, draftK: null, cur: 0, lastPick: null, loadedGuess: false, gk: null, gUnsub: null,
  rolling: false, auto: false, rmode: 'sim', manVal: '', cum: false, botDone: {},
  tbl: { op: 'sum', t: 7, pairs: true, bars: false },
  setup: (() => { try { return Object.assign({ d: 1, kind: 'face', n: 1, coin: 1 }, JSON.parse(lstore.getItem('dice_setup') || '{}')); } catch (e) { return { d: 1, kind: 'face', n: 1, coin: 1 }; } })() };
const roomPath = (p = '') => `rooms/${App.code}` + (p ? '/' + p : '');
const P = id => (S.players && S.players[id]) || {};
const sortedIds = () => Object.keys(S.players || {}).sort((a, b) => (P(a).joined || 0) - (P(b).joined || 0));
const num = id => sortedIds().indexOf(id) + 1;
function ranking() {
  const ids = Object.keys(S.players || {});
  ids.sort((a, b) => (P(b).coins || 0) - (P(a).coins || 0) || (P(a).joined || 0) - (P(b).joined || 0));
  let rank = 0, prev = null;
  return ids.map((id, i) => { const c = P(id).coins || 0; if (c !== prev) { rank = i + 1; prev = c; } return { id, c, rank }; });
}
const guessesOf = k => (S.guess && S.guess[k]) || {};
const resVals = r => arr(r && r.res).map(x => x.v);
const histList = () => arr(S.hist).sort((a, b) => a.k - b.k);
const hitsOf = (g, res) => { g = arr(g); let h = 0; res.forEach((v, i) => { if (g[i] === v) h++; }); return h; };
const scoreOf = (r, g, res) => isBig(r) ? (modesOf(res).includes(arr(g)[0]) ? 1 : 0) : hitsOf(g, res);

/* =====================================================================
   입장 화면
   ===================================================================== */
function renderEntry(o = {}) {
  App.mode = null;
  const room = o.room || '';
  let host = null; try { host = JSON.parse(store.getItem(HOST_KEY) || 'null'); } catch (e) {}
  $('#app').innerHTML = `
  <div class="E">
    <div class="E-hero"><div class="E-logo">${dieSVG(5, 'A')}${dieSVG(2, 'B')}</div>
      <h1 class="E-title">주사위 맞추기</h1>
      <p>주사위 결과를 예상해서 코인을 모아요. 코인을 가장 많이 모은 친구가 우승!</p></div>
    <section class="E-card">
      <label>방 번호<input id="inCode" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(room)}" placeholder="선생님 화면의 4자리"></label>
      <label>이름<input id="inName" maxlength="8" autocomplete="off" placeholder="예: 김민수"></label>
      <button class="btn big" data-a="join">입장하기</button>
      <p class="err" id="err">${esc(o.msg || '')}</p>
      <details><summary>이미 들어왔었는데 화면이 꺼졌나요?</summary>
        <div class="E-sub"><label>재입장 코드 (선생님께 물어보세요)<input id="inRe" inputmode="numeric" maxlength="3" autocomplete="off"></label>
        <button class="btn ghost" data-a="rejoin">다시 들어가기</button></div></details>
    </section>
    <section class="E-teacher">
      ${host ? `<button class="btn resume" data-a="resume">${esc(host.code)}번 방 계속 진행하기 (선생님)</button>` : ''}
      <details><summary>선생님용</summary>
        <div class="E-card" style="margin-top:10px">
          <label>비밀번호<input id="inPw" type="password" inputmode="numeric" autocomplete="off"></label>
          <button class="btn" data-a="create">새 방 만들기</button>
          <label>진행 중인 방 번호<input id="inOld" inputmode="numeric" maxlength="4" autocomplete="off"></label>
          <button class="btn ghost" data-a="open">이 기기에서 이어서 진행하기</button>
        </div></details>
    </section>
    ${DB.mode === 'local' ? '<p class="note">⚠️ 체험 모드예요. 이 브라우저의 여러 탭끼리만 연결돼요. (선생님 탭에서 방을 만들고, 다른 탭에서 학생으로 입장해 보세요.)</p>' : ''}
  </div>`;
}
const setErr = t => { const e = $('#err'); if (e) e.textContent = t; };

async function studentJoin() {
  const code = $('#inCode').value.trim(), name = $('#inName').value.trim().replace(/\s+/g, ' ');
  if (!/^\d{4}$/.test(code)) return setErr('방 번호 4자리를 입력하세요.');
  if (!name) return setErr('이름을 입력하세요.');
  const meta = await DB.get(`rooms/${code}/meta`);
  if (!meta) return setErr('그런 방이 없어요. 번호를 다시 확인하세요.');
  const players = (await DB.get(`rooms/${code}/players`)) || {};
  const saved = store.getItem(PID_KEY(code));
  if (saved && players[saved]) return enterStudent(code, saved);
  // 이미 있는 이름 = 튕겨서 다시 들어오는 학생일 수 있음 → 선생님이 '허용'을 누르면 원래 자리(코인 그대로)로 복귀
  const same = Object.keys(players).find(id => !players[id].bot && players[id].name === name);
  if (same) return requestRejoin(code, name, meta.phase !== 'lobby');
  if (Object.keys(players).length >= MAX_PLAYERS) return setErr(`방이 꽉 찼어요 (최대 ${MAX_PLAYERS}명).`);
  const pid = 'p' + rid(8);
  await DB.set(`rooms/${code}/players/${pid}`, { name, joined: DB.now(), rejoin: String(100 + Math.floor(Math.random() * 900)), coins: 0 });
  store.setItem(PID_KEY(code), pid);
  enterStudent(code, pid);
}
async function requestRejoin(code, name, started) {
  leaveRoom();
  const rq = 'r' + rid(6);
  await DB.set(`rooms/${code}/req/${rq}`, { name, at: DB.now() });
  App.mode = 'wait';
  $('#app').innerHTML = `<div class="E"><section class="E-card waitreq">
    <div class="pi">🔄</div><h2>선생님 화면을 봐 주세요</h2>
    <p><b>${esc(name)}</b> 이름으로 다시 들어가기를 요청했어요.<br>선생님이 <b>허용</b>을 누르면 원래 자리로 돌아가요. 코인도 그대로예요.</p>
    ${started ? '' : '<p class="muted">처음 들어온 거라면 같은 이름이 이미 있는 거예요. 취소하고 이름 뒤에 번호를 붙여 주세요.</p>'}
    <button class="btn ghost" data-a="reqcancel" data-id="${rq}" data-v="${code}">취소</button></section></div>`;
  App.unsub.push(DB.on(`rooms/${code}/req/${rq}`, v => {
    if (App.mode !== 'wait') return;
    if (v && v.ok) { store.setItem(PID_KEY(code), v.ok); DB.set(`rooms/${code}/req/${rq}`, null); enterStudent(code, v.ok); }
    else if (v && v.no) { DB.set(`rooms/${code}/req/${rq}`, null); leaveRoom(); renderEntry({ room: code, msg: '선생님이 거절했어요. 이름을 확인해 주세요.' }); }
  }));
}
async function studentRejoin() {
  const code = $('#inCode').value.trim(), name = $('#inName').value.trim().replace(/\s+/g, ' '), rc = $('#inRe').value.trim();
  if (!/^\d{4}$/.test(code) || !name || !rc) return setErr('방 번호, 이름, 재입장 코드를 모두 입력하세요.');
  const players = (await DB.get(`rooms/${code}/players`)) || {};
  const pid = Object.keys(players).find(id => players[id].name === name && String(players[id].rejoin) === rc);
  if (!pid) return setErr('이름이나 재입장 코드가 맞지 않아요.');
  store.setItem(PID_KEY(code), pid);
  enterStudent(code, pid);
}
async function newRoomCode() {
  let code = '';
  for (let i = 0; i < 30; i++) { code = String(1000 + Math.floor(Math.random() * 9000)); if (!(await DB.get(`rooms/${code}/meta`))) break; }
  return code;
}
async function teacherCreate() {
  if ($('#inPw').value !== TEACHER_PW) return alert('비밀번호가 맞지 않아요.');
  await cleanupOldRooms();
  const code = await newRoomCode(); const hostId = rid(10);
  await DB.set(`rooms/${code}`, { meta: { phase: 'lobby', created: DB.now(), hostId, roundNo: 0 } });
  store.setItem(HOST_KEY, JSON.stringify({ code, hostId }));
  enterTeacher(code, hostId);
}
async function teacherOpen() {
  if ($('#inPw').value !== TEACHER_PW) return alert('비밀번호가 맞지 않아요.');
  const code = $('#inOld').value.trim();
  if (!(await DB.get(`rooms/${code}/meta`))) return alert('그런 방이 없어요.');
  const hostId = rid(10);
  await DB.update(`rooms/${code}/meta`, { hostId });
  store.setItem(HOST_KEY, JSON.stringify({ code, hostId }));

}
async function teacherResume() {
  let host = null; try { host = JSON.parse(store.getItem(HOST_KEY) || 'null'); } catch (e) {}
  if (!host) return;
  if (!(await DB.get(`rooms/${host.code}/meta`))) { store.removeItem(HOST_KEY); return renderEntry({ msg: '그 방은 이미 없어졌어요.' }); }
  enterTeacher(host.code, host.hostId);
}
// 하루가 지난 방은 새 방을 만들 때 정리
async function cleanupOldRooms() {
  try {
    const rooms = (await DB.get('rooms')) || {}; const now = DB.now();
    for (const code in rooms) { const c = rooms[code] && rooms[code].meta && rooms[code].meta.created; if (!c || now - c > 24 * 3600 * 1000) await DB.remove('rooms/' + code); }
  } catch (e) {}
}

let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && App.mode === 'teacher') keepAwake(); });
let connReady = false;

function leaveRoom() {
  App.unsub.forEach(f => f()); App.unsub = []; App.timers.forEach(clearInterval); App.timers = [];
  if (App.gUnsub) { App.gUnsub(); App.gUnsub = null; } App.gk = null;
  App.auto = false; App.rolling = false; App.ov = null; App.ovShown = null;
  S = {}; const ov = $('#overlay'); if (ov) ov.innerHTML = '';

/* =====================================================================
   선생님 화면
   ===================================================================== */
function enterTeacher(code, hostId) {
  leaveRoom();
  Object.assign(App, { mode: 'teacher', code, hostId, draftK: null });
  keepAwake();
  App.unsub.push(DB.on(roomPath(), v => {
    S = v || {};
    if (!S.meta) { store.removeItem(HOST_KEY); leaveRoom(); return renderEntry({ msg: '방이 사라졌어요.' }); }
    App.active = S.meta.hostId === App.hostId;
    hostOnData(); renderTeacher();
  }));
}
const joinURL = () => location.origin + location.pathname + '?room=' + App.code;

// 체험 모드의 봇: 라운드가 열리면 아무 숫자나 골라 제출
function hostOnData() {
  if (!App.active || DB.mode !== 'local') return;
  const r = S.round; if (!r || r.state !== 'open') return;
  const g = guessesOf(r.k); const up = {}; const vals = choices(r.d, r.kind);
  for (const id of Object.keys(S.players || {})) {
    if (!P(id).bot || g[id] || App.botDone[r.k + id]) continue;
    App.botDone[r.k + id] = 1;
    up[id] = Array.from({ length: slotsN(r) }, () => vals[Math.floor(Math.random() * vals.length)]);
  }
  if (Object.keys(up).length) setTimeout(() => DB.update(roomPath('guess/' + r.k), up), 300 + Math.random() * 900);
}

function renderTeacher() {
  const m = S.meta; const app = $('#app');
  if (!m) { app.innerHTML = '<div class="E"><p>방을 불러오는 중이에요…</p></div>'; return; }
  const keep = document.getElementById('stage');
  const ae = document.activeElement; const focusId = ae && ae.tagName === 'INPUT' ? ae.id : null;
  const html = m.phase === 'lobby' ? lobbyHTML() : m.phase === 'end' ? endHTML() : playHTML();
  app.innerHTML = html + reqBarHTML();
  const ph = document.getElementById('stage');
  if (ph) { if (keep && keep.dataset.k === ph.dataset.k) ph.replaceWith(keep); else buildStage(ph); }
  if (m.phase === 'lobby' && window.QRCode && $('#qr')) {
    try { new QRCode($('#qr'), { text: joinURL(), width: 260, height: 260, colorDark: '#1C2142', colorLight: '#ffffff' }); } catch (e) {}
  }
  if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus(); const L = f.value.length; try { f.setSelectionRange(L, L); } catch (e) {} } }
  renderOverlay();
}

function boardHTML(lim) {
  let rk = ranking(); if (!rk.length) return '<p class="muted">아직 아무도 없어요.</p>';
  if (lim) rk = rk.filter(x => x.rank <= lim);
  const r = S.round; const h = !lim && r && r.state === 'done' && S.hist && S.hist[r.k];
  return `<ol class="board ${lim ? 'big' : rk.length > 14 ? 'two' : ''}">${rk.map(x => {
    const g = h && h.hits && h.hits[x.id] ? h.hits[x.id] * h.coin : 0;
    return `<li class="${x.rank <= 3 && x.c > 0 ? 'top' + x.rank : ''}" data-a="stu" data-id="${x.id}"><span class="rk">${x.rank}</span><span class="nm">${esc(P(x.id).name)}</span>
      <span class="up">${g ? '+' + g : ''}</span><span class="cn">${x.c}</span></li>`; }).join('')}</ol>`;
}
function qTitleHTML(r) {

function saveSetup() { try { lstore.setItem('dice_setup', JSON.stringify(App.setup)); } catch (e) {} }

// 같은 종류(주사위 개수·맞힐 것)의 지난 결과를 모두 모은 그래프
function cumHTML(cfg, force) {
  const hs = histList().filter(h => sameCfg(h, cfg)); const all = hs.flatMap(h => arr(h.res));
  if (!all.length) return '';
  const vals = possible(cfg.d, cfg.kind); const cnt = {}; all.forEach(v => (cnt[v] = (cnt[v] || 0) + 1));
  if (!force && !App.cum) return `<div><button class="toggle" data-a="cum">📊 '주사위 ${cfg.d}개 · ${KIND_NAME[cfg.kind]}' 지금까지 결과 모아보기 (${all.length}번)</button></div>`;
  return `<div class="ch"><h4><span>📊 주사위 ${cfg.d}개 · ${KIND_NAME[cfg.kind]} — 지금까지 나온 결과 모두</span><small>${hs.length}라운드 · ${all.length}번 <button class="toggle on" data-a="cum">접기</button></small></h4>
    ${barsHTML(vals, cnt, { cls: 'res' })}</div>`;
}
// 값마다 정해진 색 (같은 숫자는 어느 그래프에서나 같은 색)
const BAR_COLORS = ['#E5484D', '#F76B15', '#F5A623', '#D9B700', '#8BC34A', '#17A15A', '#12A5A5', '#2F8FED', '#2F5FD0', '#6E56CF', '#B14FC5', '#E93D82'];
const barColor = v => BAR_COLORS[((Math.round(v) % BAR_COLORS.length) + BAR_COLORS.length) % BAR_COLORS.length];
function barsHTML(vals, cnt, o = {}) {
  const mx = Math.max(1, ...vals.map(v => cnt[v] || 0));
  const hot = v => o.hot != null && (Array.isArray(o.hot) ? o.hot.includes(v) : o.hot === v);
  return `<div class="bars ${o.cls || ''} ${vals.length > 16 ? 'many' : ''}">${vals.map(v => { const c = cnt[v] || 0;
    return `<div class="bc ${hot(v) ? 'hot' : ''}"><div class="bw"><i style="height:${c / mx * 100}%;background:${barColor(v)}">${c ? `<em>${c}</em>` : ''}</i></div><b>${v}</b></div>`; }).join('')}</div>`;
}

// 학생 예상 막대그래프: 시도 횟수만큼 (몇 번째 칸에 어떤 숫자를 많이 골랐는지). 결과가 나오면 그 숫자를 초록으로
function slotChartsHTML(r) {
  const g = guessesOf(r.k); const vals = choices(r.d, r.kind); const res = arr(r.res);
  const subs = Object.keys(g).filter(id => S.players && S.players[id]).map(id => arr(g[id]));
  if (!subs.length) return '<p class="muted">아직 제출한 답이 없어요.</p>';
  return `<div class="pgrid n${r.n}">${Array.from({ length: r.n }, (_, i) => {
    const cnt = {}; subs.forEach(a => { if (a[i] != null) cnt[a[i]] = (cnt[a[i]] || 0) + 1; });
    const x = res[i]; const hit = x ? subs.filter(a => a[i] === x.v).length : 0;
    return `<div class="ch"><h4><span>${r.n > 1 ? (i + 1) + '번째' : '우리 반의 예상'}</span><small>${x ? `결과 <b>${x.v}</b> · 🎯${hit}명` : '결과 ?'}</small></h4>${barsHTML(vals, cnt, { cls: 'pick', hot: x ? x.v : null })}</div>`;
  }).join('')}</div>`;
}
function openHTML(r) {
  const ids = sortedIds(); const g = guessesOf(r.k); const done = ids.filter(id => g[id]).length;
  return `${qTitleHTML(r)}
    <div class="stage-wrap"><div id="stage" class="stage" data-k="${r.k}-${r.d}" data-d="${r.d}"></div></div>
    <div class="prog"><div class="lbl"><span>휴대폰에서 예상한 숫자를 골라 제출하세요</span><span><b>${done}</b> / ${ids.length}명 제출</span></div>
      <div class="bar"><i style="width:${ids.length ? done / ids.length * 100 : 0}%"></i></div>
      <div class="notyet">${ids.map(id => `<span class="${g[id] ? 'done' : ''}">${g[id] ? '✓ ' : ''}${esc(P(id).name)}</span>`).join('')}</div></div>
    <div class="row"><button class="btn big dark" data-a="close">⏹ 제출 마감하기</button>
      <button class="btn ghost" data-a="cancelround">✕ 이 라운드 취소</button>
      <button class="toggle ${App.peek ? 'on' : ''}" data-a="peek">📊 예상 그래프 ${App.peek ? '숨기기' : '미리 보기'}</button></div>
    ${App.peek ? `<div class="peek"><h3>📊 지금까지 들어온 예상</h3>${slotChartsHTML(r)}</div>` : ''}`;
}
function rollHTML(r) {
  if (isBig(r)) return bigRollHTML(r);

/* ---- 3D 주사위 ---- */
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const ORIENT = { 1: [0, 0], 6: [0, 180], 3: [0, -90], 4: [0, 90], 2: [-90, 0], 5: [90, 0] };
function buildStage(ph) {
  const d = +ph.dataset.d || 1; const r = S.round;
  const lastF = r && arr(r.res).map(x => x.f).filter(Boolean).slice(-1)[0];
  const start = lastF || [6, 5, 4];
  const wrap = document.createElement('div'); wrap.className = 'dice';
  for (let i = 0; i < d; i++) {
    const col = document.createElement('div'); col.className = 'dcol';
    const die = document.createElement('div'); die.className = 'die c' + DCOL[i];
    [1, 2, 3, 4, 5, 6].forEach(n => {
      const f = document.createElement('div'); f.className = 'face f' + n;
      for (let j = 0; j < 9; j++) { const p = document.createElement('i'); if (PIPS[n].includes(j)) p.className = 'p'; f.appendChild(p); }
      die.appendChild(f);
    });
    die._spin = 0; setDie(die, start[i] || 1, false);
    col.appendChild(die);
    if (d > 1) { const lb = document.createElement('span'); lb.textContent = DCOL[i]; col.appendChild(lb); }
    wrap.appendChild(col);
  }
  ph.appendChild(wrap);
}
function setDie(el, v, spin) {
  if (spin) el._spin = (el._spin || 0) + 2;
  const [rx, ry] = ORIENT[v]; const e = 360 * (el._spin || 0);
  el.style.transform = `rotateX(${rx + e}deg) rotateY(${ry + e}deg) rotateZ(0deg)`;
}
// 주사위가 통통 튀며 마구 구르다가(ms 동안) 결과 면에서 멈춤
async function tumbleTo(f, ms) {
  const st = document.getElementById('stage'); const dice = [...document.querySelectorAll('#stage .die')];
  if (!st || !dice.length) { await sleep(ms); return; }
  st.classList.add('rolling');
  dice.forEach(el => { el.classList.remove('settle'); el.classList.add('tumbling'); });
  const end = Date.now() + ms - 400;
  while (Date.now() < end) {
    dice.forEach(el => { el._spin = (el._spin || 0) + 1; const e = 360 * el._spin;
      el.style.transform = `rotateX(${e + Math.random() * 360}deg) rotateY(${e + Math.random() * 360}deg) rotateZ(${Math.random() * 180}deg)`; });
    await sleep(140);
  }
  const st2 = document.getElementById('stage') || st; st2.classList.remove('rolling');
  dice.forEach((el, i) => { el.classList.remove('tumbling'); el.classList.add('settle'); setDie(el, f[i], true); });
  await sleep(400);
}

  if (a === 'rollauto') return rollAuto();
  if (a === 'man') return manualPush(v);
  if (a === 'dellast' && r && r.state !== 'done' && !isBig(r)) { const res = arr(r.res); if (res.length) return DB.update(roomPath('round'), { res: res.slice(0, -1) }); return; }
  if (a === 'score') return scoreRound();
  if (a === 'undo') return undoScore();
  if (a === 'nextround') { App.cum = false; App.rmode = 'sim'; return DB.update(roomPath(), { round: null }); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  if (el.tagName === 'SUMMARY') e.preventDefault();
  if (el.tagName === 'INPUT') return;
  // 덮개 바깥(어두운 부분)을 누를 때만 닫기
  if (el.classList.contains('ov') && e.target !== el) return;
  onAction(el.dataset.a, el);
});
document.addEventListener('input', e => { if (e.target.id === 'manIn') App.manVal = e.target.value; });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'inName') studentJoin();
  if (e.key === 'Enter' && e.target.id === 'inRe') studentRejoin();
  if (e.key === 'Enter' && e.target.id === 'inPw') teacherCreate();
  if (e.key === 'Enter' && e.target.id === 'manIn') { const v = e.target.value.trim(); if (v) manualPush(v); }
  if (e.key === 'Escape' && App.mode === 'teacher' && App.ov) { App.ov = null; renderOverlay(); }
  // 선생님 화면: 스페이스바로 한 번 던지기
  if (e.code === 'Space' && App.mode === 'teacher' && App.active && !App.ov && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) {
    const r = S.round; if (r && r.state === 'closed' && (App.rmode === 'sim' || isBig(r)) && r.n - arr(r.res).length > 0) { e.preventDefault(); isBig(r) ? rollBig() : rollOne(); }
  }
});

/* 시작 */
(function init() {
  const room = new URLSearchParams(location.search).get('room');
  if (room) { const pid = store.getItem(PID_KEY(room)); if (pid) return enterStudent(room, pid); }
  renderEntry({ room: room || '' });
})();
</script>
